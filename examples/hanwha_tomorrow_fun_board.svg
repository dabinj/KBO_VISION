<text x="42" y="648" font-size="13" font-family="Segoe UI, Arial" fill="#102a43">1. 좌타 상대로는 화이트의 2025 패턴상 직구-커브 축, 우타 상대로는 커터-투심-슬라이더 축을 더 강하게 반영했습니다.</text>
<text x="42" y="672" font-size="13" font-family="Segoe UI, Arial" fill="#102a43">2. 2025 live 약점은 방향 prior로만 사용했고, 그 약점으로 무조건 간다고 가정하지는 않았습니다.</text>
<text x="42" y="696" font-size="13" font-family="Segoe UI, Arial" fill="#102a43">3. 포수는 화이트의 2025 수신 비중이 가장 큰 조형우 계열 배합 흐름을 우선 가정했습니다.</text>
