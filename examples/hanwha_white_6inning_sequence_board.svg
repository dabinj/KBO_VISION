<text x="42" y="198" font-size="11" font-family="Segoe UI, Arial" fill="#102a43">000 | 오재원: 초구 커브 OUT, 2구 커터 MIDDLE_RIGHT, 결과 안타</text>
<text x="42" y="218" font-size="11" font-family="Segoe UI, Arial" fill="#102a43">100 | 페라자: 초구 직구 OUT, 2구 직구 HIGH_LEFT, 결과 아웃</text>
