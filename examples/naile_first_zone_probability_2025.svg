<text x="720" y="710" font-size="18" fill="#6a5a45">1. 전체 prior 기준으로는 OUT 비율이 가장 큽니다.</text>
<text x="720" y="742" font-size="18" fill="#6a5a45">2. 인존에서는 가운데와 낮은 코스가 상대적으로 많이 보입니다.</text>
<text x="720" y="774" font-size="18" fill="#6a5a45">3. 실제 예측은 여기에 주자상황, 아웃카운트, 포수, 타자 성향을 더해 조정됩니다.</text>
