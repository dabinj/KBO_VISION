<text x="42" y="532" font-size="13" font-family="Segoe UI, Arial" fill="#102a43">3. 즉 약점 정보는 지금 단계에서 “무슨 공”보다 “어디로 공략하나”에 더 가까운 signal로 읽는 것이 자연스럽습니다.</text>
